<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Custom Chat Notifier</title><link rel="stylesheet" href="/src/ui.css"></head>
  <body class="popup-body">
    <main class="popup">
      <div class="brand"><img src="/icons/icon-48.png" width="40" height="40" alt=""><div><strong>Custom Chat Notifier</strong><span id="popup-status">Loading…</span></div></div>
      <div class="switch-row"><div><strong>Notifications</strong><span id="popup-selected">0 chats selected</span></div><input id="popup-enabled" type="checkbox" role="switch"></div>
      <div class="actions vertical"><button id="open-settings" class="primary">Open settings</button><button id="popup-test">Send test notification</button></div>
    </main>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
